[workspace]
name = "web_camera_realtime"
version = "0.1.0"
description = "USB 摄像头实时串流：录制、WebRTC 浏览器串流、Pico VR 直连串流"
authors = ["eai"]
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64"]

[dependencies]
python = "3.12.*"
aiohttp = ">=3.9"
aiortc = ">=1.6"
av = ">=11"
numpy = ">=1.26"
opencv = ">=4.8"
pyzmq = ">=25"

[tasks]
stream = "python stream.py --usb-camera /dev/video0"
stream-rk3588 = "python stream_rk3588.py --usb-camera /dev/video0 --width 1280 --height 960"
stream-vr = "python stream_vr.py --usb-camera /dev/video0 --width 1280 --height 960"
stream-hand = "python stream_hand.py --usb-camera /dev/video0"
stream-pico = "python stream_to_pico.py --device /dev/video0 --encoder libx264 --width 1280 --height 960"
stream-pico-rkmpp = "python stream_to_pico.py --device /dev/video0 --encoder h264_rkmpp --width 1280 --height 960"
record = "python record.py"
record-list = "python record.py --list"
brainco-listener = "python brainco_vr_trigger_listener.py"
